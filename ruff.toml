exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

src = ["src"]

line-length = 100
indent-width = 4
target-version = "py313"

[lint]
select = ["ALL"]
ignore = [
    "S101",
    "E731",
    "EM101",
    "EM102",
    "T201",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D203",
    "D205",
    "D212",
    "D415",
    "COM812",
    "ISC001",
    "TD002",
    "TD003",
    "TRY003",
    "UP007",
    "UP035",
    "FIX002",
    "PLR0913",
]
fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**/*.py" = [
    "S101",
    "ARG001",
    "FBT001",
    "PLR2004",
    "S311",
    "ANN001",
    "ANN201",
    "RET503",
    "D101",
    "D102",
    "INP001",
    "TC003",
]
"scripts/**/*.py" = [
    "INP001",
    "S113",
    "T201",
]

[lint.mccabe]
max-complexity = 10

[lint.pycodestyle]
max-doc-length = 99

[lint.pydocstyle]
convention = "google"

[lint.isort]
combine-as-imports = true
force-single-line = false
split-on-trailing-comma = false
force-sort-within-sections = true

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
