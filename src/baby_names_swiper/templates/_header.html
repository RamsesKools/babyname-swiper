<header class="topbar">
    <a class="brand" href="/swipe">
        <img src="/static/logos/logo.svg" alt="Baby Names Swiper">
    </a>
    <nav>
        <a href="/swipe" class="{% if request.url.path == '/swipe' %}active{% endif %}">swipe</a>
        <a href="/overview" class="{% if request.url.path == '/overview' %}active{% endif %}">overview</a>
        <a href="/upload" class="{% if request.url.path == '/upload' %}active{% endif %}">upload</a>
        {% if user is defined and user %}
            <span class="who">{{ user }}</span>
            <a href="/logout">switch</a>
        {% endif %}
    </nav>
</header>
