<div id="card" class="swiper-card-wrap">
    {% set name_value = name if name is defined else current_name %}
    {% set mode_value = active_mode if active_mode is defined else 'random' %}
    {% set reswipe_value = 1 if (reswipe is defined and reswipe) else 0 %}
    <div class="card"
         data-card
         data-name="{{ name_value }}"
         data-list="{{ active_list }}">
        <div class="stamp stamp-like">like</div>
        <div class="stamp stamp-nope">nope</div>
        <div class="name">{{ name_value }}</div>
        <div class="meta">drag, click the buttons, or use &larr; / &rarr;</div>
    </div>
    <div class="actions">
        <button class="btn btn-nope"
                data-action="nope"
                hx-post="/swipe"
                hx-target="#card"
                hx-swap="outerHTML"
                hx-vals='{"name": "{{ name_value }}", "direction": 0, "list": "{{ active_list }}", "mode": "{{ mode_value }}", "reswipe": {{ reswipe_value }}}'>
            nope
        </button>
        <button class="btn btn-like"
                data-action="like"
                hx-post="/swipe"
                hx-target="#card"
                hx-swap="outerHTML"
                hx-vals='{"name": "{{ name_value }}", "direction": 1, "list": "{{ active_list }}", "mode": "{{ mode_value }}", "reswipe": {{ reswipe_value }}}'>
            like
        </button>
    </div>
    <div class="undo-row">
        <button class="btn btn-undo"
                data-action="undo"
                hx-post="/swipe/undo"
                hx-target="#card"
                hx-swap="outerHTML"
                hx-vals='{"list": "{{ active_list }}", "mode": "{{ mode_value }}", "reswipe": {{ reswipe_value }}}'>
            undo last
        </button>
    </div>
</div>
