{% extends "base.html" %}
{% block title %}Overview — {{ active_list }}{% endblock %}
{% block content %}
<div class="list-picker">
    <label for="list-picker">list:</label>
    <select id="list-picker" name="list" data-control="list">
        {% for nl in lists %}
        <option value="{{ nl.slug }}" {% if nl.slug == active_list %}selected{% endif %}>
            {{ nl.label }}
        </option>
        {% endfor %}
    </select>
</div>

<div id="overview-body">
    {% include "_overview_body.html" with context %}
</div>
{% endblock %}
